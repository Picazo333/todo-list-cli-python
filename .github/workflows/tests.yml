name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Official exercise tests
        run: python3 test.py
      - name: CSV and error-path tests
        run: python3 -m unittest tests.test_robustness -v
